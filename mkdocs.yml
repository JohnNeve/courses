site_name: I Miei Appunti
site_url: https://johnneve.github.io/courses/

theme:
  name: material
  palette:
    # Aggiunge il tasto per la dark mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Passa al tema scuro
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Passa al tema chiaro
  features:
    - navigation.tabs          # Sposta le macro-categorie in alto
    - navigation.top           # Aggiunge la freccia "Torna su" a fine pagina
    - navigation.path          # Aggiunge le briciole di pane (Home > Corso > Lezione)
    - navigation.footer        # Aggiunge i tasti "Lezione Precedente/Successiva" a fondo pagina
    - search.suggest           # Suggerisce parole mentre scrivi nella barra di ricerca
    - navigation.indexes
    - navigation.expand
    - content.code.copy
  font:
    text: Roboto               # Font per la lettura
    code: Fira Code            # Font speciale per i blocchi di codice

plugins:      
  - search
  - tags

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - footnotes                     # <-- AGGIUNTO: per le note a piè di pagina [^1]
  - abbr                          # <-- AGGIUNTO: per i tooltip (es. BGP)
  - pymdownx.keys                 # <-- AGGIUNTO: per i tasti grafici ++ctrl++
  - admonition                    # Riquadri colorati classici
  - pymdownx.details              # Riquadri a scomparsa (collapsible)
  - pymdownx.superfences:         
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:              # Schede (Tabs)
      alternate_style: true
  - pymdownx.tasklist:            # Checkbox (Task lists)
      custom_checkbox: true
  - pymdownx.highlight:           # Evidenziazione sintassi
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite         # Codice in linea
  - pymdownx.arithmatex:          # Formule matematiche (LaTeX)
      generic: true
  - pymdownx.mark                 # Evidenziatore testo (==testo==)
  - attr_list                     # Allineamento e CSS personalizzato
  - md_in_html                    # Markdown dentro l'HTML

nav:
  - Home: index.md
  - Networking:
    - Panoramica: networking/index.md
    - 1. Introduzione: networking/01-introduzione.md
    - 2. Protocolli: networking/02-protocolli-base.md
  - Cybersecurity HTB:
    - Metodologia: cyber-htb/index.md
    - 1. Recon: cyber-htb/01-reconnaissance.md